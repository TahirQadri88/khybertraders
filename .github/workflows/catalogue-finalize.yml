name: Final Single Catalogue QA

on:
  push:
    branches: [claude/website-improvements-tlKIS]
    paths:
      - '.github/workflows/catalogue-finalize.yml'
      - 'scripts/finalize_catalogue.sh'
      - 'scripts/catalogue_qa.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: claude/website-improvements-tlKIS
      - name: Apply final catalogue source changes
        run: bash scripts/finalize_catalogue.sh
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Run genuine rendered desktop + mobile QA
        run: node scripts/catalogue_qa.js
      - name: Remove temporary QA files and commit certified source
        if: success()
        run: |
          rm -rf node_modules package.json package-lock.json
          rm -f .github/workflows/catalogue-finalize.yml scripts/finalize_catalogue.sh scripts/catalogue_qa.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize single-catalogue UI after rendered QA'
          git push origin HEAD:claude/website-improvements-tlKIS
