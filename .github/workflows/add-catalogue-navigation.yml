name: Add catalogue navigation arrows
on:
  workflow_dispatch:
  push:
    branches: [claude/website-improvements-tlKIS]
    paths: ['.github/workflows/add-catalogue-navigation.yml']

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/website-improvements-tlKIS
          fetch-depth: 1

      - name: Add category navigation arrows
        shell: python
        run: |
          from pathlib import Path
          p = Path('assets/cart.js')
          s = p.read_text()
          old = '''#category-modal{display:none!important}#search-results{display:none!important}#tiles-container.kt-source-hidden{display:none!important}\n#kt-catalogue-controls{max-width:1280px;margin:0 auto;padding:0 24px 8px;text-align:left}#kt-category-strip{display:flex;gap:7px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}#kt-category-strip::-webkit-scrollbar{display:none}.kt-cat{flex:0 0 auto;border:1px solid #d1d5db;background:#fff;border-radius:999px;padding:7px 13px;font:700 11px Manrope,sans-serif;cursor:pointer;color:#131313}.kt-cat.active{background:#131313;color:#fff;border-color:#131313}'''
          new = '''#category-modal{display:none!important}#search-results{display:none!important}#tiles-container.kt-source-hidden{display:none!important}\n#kt-catalogue-controls{max-width:1280px;margin:0 auto;padding:0 24px 8px;text-align:left}#kt-category-nav{position:relative;display:flex;align-items:center;gap:6px}#kt-category-strip{display:flex;gap:7px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none;scroll-behavior:smooth;flex:1;min-width:0}#kt-category-strip::-webkit-scrollbar{display:none}.kt-cat{flex:0 0 auto;border:1px solid #d1d5db;background:#fff;border-radius:999px;padding:7px 13px;font:700 11px Manrope,sans-serif;cursor:pointer;color:#131313}.kt-cat.active{background:#131313;color:#fff;border-color:#131313}.kt-cat-arrow{flex:0 0 34px;width:34px;height:34px;border:1px solid #d1d5db;background:#fff;color:#131313;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font:800 16px/1 Manrope,sans-serif;transition:background .15s,border-color .15s,opacity .15s;touch-action:manipulation}.kt-cat-arrow:hover:not(:disabled){background:#f3f4f6;border-color:#9ca3af}.kt-cat-arrow:disabled{opacity:.28;cursor:default}.kt-cat-arrow[hidden]{display:none}@media(max-width:767px){#kt-category-nav{gap:5px}.kt-cat-arrow{flex-basis:32px;width:32px;height:32px}}'''
          if old not in s:
              raise SystemExit('Expected catalogue CSS marker not found')
          s = s.replace(old, new, 1)
          old = "c.innerHTML='<div style=\"font:800 10px Manrope,sans-serif;text-transform:uppercase;letter-spacing:.12em;color:#6b7280;padding:2px 0 3px\">Browse categories</div><div id=\"kt-category-strip\" role=\"tablist\" aria-label=\"Product categories\"></div>';"
          new = "c.innerHTML='<div style=\"font:800 10px Manrope,sans-serif;text-transform:uppercase;letter-spacing:.12em;color:#6b7280;padding:2px 0 3px\">Browse categories</div><div id=\"kt-category-nav\"><button type=\"button\" class=\"kt-cat-arrow\" id=\"kt-cat-prev\" aria-label=\"Previous categories\">‹</button><div id=\"kt-category-strip\" role=\"tablist\" aria-label=\"Product categories\"></div><button type=\"button\" class=\"kt-cat-arrow\" id=\"kt-cat-next\" aria-label=\"Next categories\">›</button></div>';"
          if old not in s:
              raise SystemExit('Expected category markup marker not found')
          s = s.replace(old, new, 1)
          old = "function categories(ps){const list=[...new Set(ps.map(cat))].sort((a,b)=>a.localeCompare(b));const strip=document.getElementById('kt-category-strip');if(!strip)return;strip.innerHTML=['All',...list].map(c=>`<button type=\"button\" class=\"kt-cat ${state.category.toLowerCase()===c.toLowerCase()?'active':''}\" data-cat=\"${esc(c)}\">${esc(catTitle(c))}</button>`).join('');strip.querySelectorAll('.kt-cat').forEach(b=>b.addEventListener('click',()=>{state.category=b.dataset.cat;render();}));}"
          new = "function categories(ps){const list=[...new Set(ps.map(cat))].sort((a,b)=>a.localeCompare(b));const strip=document.getElementById('kt-category-strip');if(!strip)return;strip.innerHTML=['All',...list].map(c=>`<button type=\"button\" class=\"kt-cat ${state.category.toLowerCase()===c.toLowerCase()?'active':''}\" data-cat=\"${esc(c)}\">${esc(catTitle(c))}</button>`).join('');strip.querySelectorAll('.kt-cat').forEach(b=>b.addEventListener('click',()=>{state.category=b.dataset.cat;render();}));const prev=document.getElementById('kt-cat-prev'),next=document.getElementById('kt-cat-next');const sync=()=>{const overflow=strip.scrollWidth>strip.clientWidth+2;if(prev)prev.hidden=!overflow;if(next)next.hidden=!overflow;if(overflow){if(prev)prev.disabled=strip.scrollLeft<=2;if(next)next.disabled=strip.scrollLeft+strip.clientWidth>=strip.scrollWidth-2;}};if(prev&&!prev.dataset.bound){prev.dataset.bound='1';prev.addEventListener('click',()=>strip.scrollBy({left:-Math.max(180,strip.clientWidth*.65),behavior:'smooth'}));}if(next&&!next.dataset.bound){next.dataset.bound='1';next.addEventListener('click',()=>strip.scrollBy({left:Math.max(180,strip.clientWidth*.65),behavior:'smooth'}));}if(!strip.dataset.arrowBound){strip.dataset.arrowBound='1';strip.addEventListener('scroll',sync,{passive:true});window.addEventListener('resize',sync);}requestAnimationFrame(sync);}"
          if old not in s:
              raise SystemExit('Expected categories function marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Validate JavaScript
        run: node --check assets/cart.js

      - name: Remove temporary installer
        run: rm .github/workflows/add-catalogue-navigation.yml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cart.js .github/workflows/add-catalogue-navigation.yml
          git commit -m 'Add responsive catalogue navigation arrows'
          git push origin HEAD:claude/website-improvements-tlKIS
