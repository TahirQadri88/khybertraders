name: Restore single catalogue baseline

on:
  push:
    branches:
      - claude/website-improvements-tlKIS

jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, 'Restore single catalogue baseline') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/website-improvements-tlKIS
          fetch-depth: 0
      - name: Restore cart logic from pre-UX baseline
        run: |
          git checkout b53d8fc5923680fa4d8e3227f6e3362e116d3812 -- assets/cart.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cart.js
          git commit -m "Restore single catalogue baseline"
          git push origin HEAD:claude/website-improvements-tlKIS
