name: Sync Product Social Links
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: claude/website-improvements-tlKIS
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        # Root cause of "400 Invalid database id (default)" on every run:
        # google-api-core 2.35.0 (released 2026-08-24, previously installed
        # unpinned as a transitive dep) added urllib.parse.quote() around
        # path-template values in path_template.py -- Python's quote()
        # percent-encodes "(" and ")" by default, so Firestore's literal
        # "(default)" database sentinel got sent as "%28default%29" and the
        # API rejected it. The database ID was never actually wrong; that
        # release regressed. Pinning google-cloud-firestore alone did NOT
        # fix this (verified) since it doesn't own path encoding -- pinning
        # google-api-core below the broken release does. Neither pin
        # conflicts with firebase-admin's own requirements (verified with a
        # dry-run install).
        run: pip install firebase-admin "google-api-core<2.35.0" "google-cloud-firestore<2.29.0" pillow

      - name: Generate Product & Category Pages
        shell: python
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          import os, re, json, urllib.parse, tempfile, html as H
          from datetime import datetime, timezone

          BASE_URL = "https://animalhealth.pk"
          TODAY = datetime.now(timezone.utc).strftime('%Y-%m-%d')

          def get_clean_slug(name):
              if not name: return ""
              name = name.lower()
              name = re.sub(r'&', 'and', name)
              name = re.sub(r'\s+', '-', name)
              name = re.sub(r'[^a-z0-9-]', '', name)
              return name

          def parse_price_num(s):
              if not s: return None
              m = re.search(r'\d[\d,]*', s.replace(',', ''))
              return m.group(0) if m else None

          def cat_title(cat):
              return cat.title().replace('And', 'and').replace('For', 'for').replace(' Of ', ' of ')

          # --- Firebase service account is required. The old Google Sheets ---
          # --- fallback was removed: it silently overwrote correct Firestore-
          # --- sourced content with years-stale data whenever this secret was
          # --- missing, with no visible error. Fail loudly instead. ---
          sa_json = os.environ.get('FIREBASE_SERVICE_ACCOUNT', '')

          if not sa_json or not sa_json.strip():
              print("FATAL: FIREBASE_SERVICE_ACCOUNT secret is empty or not set.")
              print("Set it in: repo Settings -> Secrets and variables -> Actions -> Repository secrets.")
              print("Refusing to fall back to stale data; no files were changed.")
              exit(1)

          import firebase_admin
          from firebase_admin import credentials, firestore

          with tempfile.NamedTemporaryFile(mode='w', suffix='.json', delete=False) as f:
              f.write(sa_json)
              sa_path = f.name

          cred = credentials.Certificate(sa_path)
          firebase_admin.initialize_app(cred)
          db = firestore.client()

          try:
              # No server-side order_by: a compound sort on two fields needs a
              # Firestore composite index. Sort client-side instead, same as
              # index.html's fetchProducts() does.
              docs = db.collection('products').stream()
              rows = []
              for doc in docs:
                  d = doc.to_dict()
                  name = (d.get('name') or '').strip()
                  if not name: continue
                  is_resource = d.get('isResource') is True
                  # One-time bootstrap: these two items are free downloadable
                  # charts, not sellable products, but predate the isResource
                  # field. Seed it once from their existing name prefix so the
                  # field becomes the durable source of truth in Firestore --
                  # nothing downstream keys off this name prefix again.
                  if not is_resource and name.startswith('Useful Information -'):
                      doc.reference.update({'isResource': True})
                      is_resource = True
                  rows.append({
                      'name':         name,
                      'category':     (d.get('category') or '').strip(),
                      'desc':         (d.get('desc') or '').strip(),
                      'images':       d.get('images') or [],
                      'priceDisplay': (d.get('priceDisplay') or '').strip(),
                      'packSizes':    [ps for ps in (d.get('packSizes') or []) if ps.get('size')],
                      'inStock':      d.get('inStock', True),
                      'sortOrder':    d.get('sortOrder', 0) or 0,
                      'minQty':       max(1, int(d.get('minQty') or 1)),
                      'isResource':   is_resource,
                  })
              rows.sort(key=lambda p: (p['category'], p['sortOrder']))
              print(f"Loaded {len(rows)} products from Firestore.")
          except Exception as e:
              print(f"Firestore error: {e}")
              exit(1)

          # ── Shared page chrome (brand header/footer, no Tailwind dependency) ──
          PAGE_CSS = """
          * { box-sizing: border-box; margin: 0; padding: 0; }
          body { font-family: 'Manrope', sans-serif; color: #1a1a1a; background: #f4f4f5; line-height: 1.6; }
          a { color: inherit; text-decoration: none; }
          .header { background: #000000; padding: 18px 20px; display: flex; align-items: center; gap: 12px; }
          .header img { width: 36px; height: 36px; object-fit: contain; }
          .header .brand { font-family: 'Archivo', sans-serif; font-weight: 700; color: #fff; font-size: 18px; }
          .header .tag { color: #FFF200; font-size: 9px; text-transform: uppercase; letter-spacing: 2px; display: block; }
          .wrap { max-width: 760px; margin: 0 auto; padding: 24px 20px 60px; }
          .crumb { font-size: 12px; color: #6b7280; margin-bottom: 18px; }
          .crumb a:hover { color: #131313; text-decoration: underline; }
          h1 { font-family: 'Archivo', sans-serif; font-size: 28px; color: #131313; margin-bottom: 10px; line-height: 1.25; }
          .price { font-size: 20px; font-weight: 700; color: #131313; margin-bottom: 14px; }
          .stock-in { display: inline-block; background: #dcfce7; color: #166534; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; padding: 4px 10px; margin-bottom: 16px; }
          .stock-out { display: inline-block; background: #fee2e2; color: #991b1b; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; padding: 4px 10px; margin-bottom: 16px; }
          .product-img { width: 100%; max-width: 380px; display: block; background: #fff; border: 1px solid #e5e7eb; margin-bottom: 10px; }
          #share-canvas { display: none; }
          .thumbs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
          .thumbs img { width: 64px; height: 64px; object-fit: cover; background: #fff; border: 2px solid #e5e7eb; cursor: pointer; transition: border-color 0.15s; }
          .thumbs img:hover { border-color: #FFF200; }
          .packs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
          .packs span { background: #131313; color: #fff; font-size: 12px; font-weight: 700; padding: 6px 14px; }
          .desc { color: #374151; font-size: 15px; margin-bottom: 26px; white-space: pre-line; font-family: 'Source Serif 4', serif; }
          .cta { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 40px; }
          .btn { display: inline-flex; align-items: center; gap: 8px; padding: 13px 22px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
          .btn-primary { background: #131313; color: #fff; }
          .btn-primary:hover { background: #000000; }
          .btn-wa { background: #25D366; color: #fff; }
          .btn-wa:hover { background: #128C4A; }
          .btn-outline { background: #fff; color: #131313; border: 1px solid #e5e7eb; }
          .btn-outline:hover { border-color: #131313; }
          .btn-loading { opacity: 0.6; pointer-events: none; }
          .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin: 24px 0 32px; }
          .card { background: #fff; border: 1px solid #e5e7eb; padding: 14px; display: block; }
          .card:hover { border-color: #FFF200; }
          .card img { width: 100%; aspect-ratio: 1; object-fit: cover; margin-bottom: 10px; background: #f4f4f5; }
          .card h3 { font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 14px; color: #1a1a1a; margin-bottom: 4px; line-height: 1.3; }
          .card .cprice { font-size: 12px; font-weight: 700; color: #131313; }
          .footer { text-align: center; padding: 30px 20px; color: #9ca3af; font-size: 11px; }
          .footer a { color: #131313; }
          ul.smlist { list-style: none; margin: 8px 0 26px; }
          ul.smlist li { padding: 6px 0; border-bottom: 1px solid #e5e7eb; font-size: 14px; }
          ul.smlist li a:hover { color: #131313; }
          h2.smcat a { font-family:'Archivo',sans-serif; font-size: 20px; color: #131313; }
          """

          def page_head_common():
              return ('<link rel="preconnect" href="https://fonts.googleapis.com">'
                      '<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Manrope:wght@400;500;700&family=Roboto+Mono:wght@500;600;700&family=Source+Serif+4:wght@400&display=swap" rel="stylesheet">'
                      f'<style>{PAGE_CSS}</style>'
                      '<script async src="https://www.googletagmanager.com/gtag/js?id=G-GZN53B9YMP"></script>'
                      '<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}'
                      "gtag('js', new Date());gtag('config', 'G-GZN53B9YMP');</script>")

          def header_html():
              return f'''<div class="header">
          <a href="{BASE_URL}/" style="display:flex;align-items:center;gap:12px">
          <img src="{BASE_URL}/images/KT_Logo_Icon.png" alt="Khyber Traders logo">
          <span><span class="brand">Khyber Traders</span><span class="tag">Wholesale Veterinary Pharmacy &middot; Karachi</span></span>
          </a>
          </div>'''

          def footer_html():
              return f'''<div class="footer">
          <p>Khyber Traders &middot; Katchi Gali, Karachi &middot; <a href="tel:+923352999006">0335-2999006</a></p>
          <p style="margin-top:6px"><a href="{BASE_URL}/">Home</a> &middot; <a href="{BASE_URL}/sitemap.html">Full Catalog</a></p>
          </div>'''

          # ── Extra chrome for /s/ product pages only (category & sitemap pages ──
          # ── are untouched): the cart/checkout widget shared with index.html   ──
          # ── needs Firebase + Tailwind + Font Awesome, loaded only here.        ──
          def product_page_extra_head():
              return '''<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
          <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
          <script src="https://cdn.tailwindcss.com"></script>
          <script>
          tailwind.config = {
              theme: { extend: {
                  fontFamily: { sans: ['"Manrope"', 'sans-serif'], serif: ['"Archivo"', 'sans-serif'], mono: ['"Roboto Mono"', 'monospace'] },
                  colors: { brand: { maroon: '#131313', gold: '#FFF200', goldBright: '#FFF200', dark: '#000000', light: '#F6F6F6' } }
              } }
          };
          </script>
          <style>
          #cart-drawer { transition: transform 0.3s ease; transform: translateX(100%); }
          #cart-drawer.open { transform: translateX(0); }
          #cart-items-list::-webkit-scrollbar { width: 5px; }
          #cart-items-list::-webkit-scrollbar-track { background: #f4f4f5; border-radius: 3px; }
          #cart-items-list::-webkit-scrollbar-thumb { background: #131313; border-radius: 3px; }
          .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; }
          .pack-btn { background: #fff; border: 2px solid #e5e7eb; color: #131313; font-size: 12px; font-weight: 700; padding: 8px 16px; cursor: pointer; font-family: 'Manrope', sans-serif; }
          .pack-btn.active { border-color: #131313; background: #131313; color: #fff; }
          </style>'''

          def header_html_with_cart():
              return f'''<div class="header" style="justify-content:space-between">
          <a href="{BASE_URL}/" style="display:flex;align-items:center;gap:12px">
          <img src="{BASE_URL}/images/KT_Logo_Icon.png" alt="Khyber Traders logo">
          <span><span class="brand">Khyber Traders</span><span class="tag">Wholesale Veterinary Pharmacy &middot; Karachi</span></span>
          </a>
          <button id="cart-btn" onclick="openCart()" aria-label="View order list" style="position:relative;background:none;border:none;color:#FFF200;font-size:20px;cursor:pointer;padding:6px">
          <i class="fas fa-shopping-cart"></i>
          <span id="cart-badge" class="hidden" style="position:absolute;top:-2px;right:-2px;background:#FFF200;color:#131313;font-size:9px;font-weight:700;border-radius:9999px;width:16px;height:16px;display:flex;align-items:center;justify-content:center;line-height:1"></span>
          </button>
          </div>'''

          def cart_widget_html():
              return '''<div id="cart-toast" class="hidden fixed bottom-28 left-1/2 -translate-x-1/2 z-[300] bg-brand-dark text-white text-xs font-bold px-4 py-2.5 shadow-xl pointer-events-none max-w-xs text-center"></div>
          <div id="cart-overlay" class="hidden fixed inset-0 bg-black/60 z-[250]" onclick="closeCart()"></div>
          <div id="cart-drawer" class="fixed top-0 right-0 h-full w-full max-w-sm bg-white z-[260] shadow-2xl flex flex-col">
              <div class="flex items-center justify-between px-5 py-4 bg-brand-dark text-white flex-shrink-0">
                  <div class="flex items-center gap-2">
                      <i class="fas fa-shopping-cart text-brand-gold"></i>
                      <span class="font-bold text-sm uppercase tracking-widest">Your Order List</span>
                  </div>
                  <button onclick="closeCart()" class="text-gray-400 hover:text-white text-2xl leading-none">&times;</button>
              </div>
              <div id="cart-empty-state" class="flex-1 flex flex-col items-center justify-center text-gray-400 p-8">
                  <i class="fas fa-shopping-cart text-5xl mb-4 text-gray-200"></i>
                  <p class="font-bold text-gray-700 mb-1">Your order list is empty</p>
                  <p class="text-xs text-center">Browse products and tap <strong>Add to Order</strong> to build your order</p>
              </div>
              <div id="cart-filled" class="hidden flex-1 flex flex-col overflow-hidden">
                  <div class="relative flex-1 overflow-hidden">
                      <div id="cart-items-list" class="h-full overflow-y-scroll px-4 py-3 space-y-2"></div>
                      <div id="cart-scroll-fade" class="pointer-events-none absolute bottom-0 left-0 right-0 h-10 transition-opacity duration-200" style="background:linear-gradient(to top,#fff 20%,transparent)"></div>
                  </div>
                  <div class="px-4 pb-5 pt-3 flex-shrink-0 bg-white border-t space-y-2">
                      <button onclick="openCheckout()"
                          class="w-full bg-brand-maroon hover:bg-brand-dark text-white font-bold py-3.5 text-sm uppercase tracking-widest flex items-center justify-center gap-2 transition shadow-md">
                          Review Order &amp; Checkout <i class="fas fa-arrow-right text-xs"></i>
                      </button>
                      <button onclick="clearCart()"
                          class="w-full text-[10px] text-gray-500 hover:text-red-500 transition py-1 uppercase tracking-widest">
                          Clear all items
                      </button>
                  </div>
              </div>
          </div>
          <div id="checkout-screen" class="hidden fixed inset-0 bg-gray-100 z-[280] flex flex-col">
              <div class="flex items-center gap-3 px-5 py-4 bg-brand-dark text-white flex-shrink-0">
                  <button onclick="closeCheckout()" class="text-gray-300 hover:text-white p-1" aria-label="Back to order list">
                      <i class="fas fa-arrow-left"></i>
                  </button>
                  <span class="font-bold text-sm uppercase tracking-widest">Checkout</span>
                  <button onclick="closeCheckout(); closeCart();" class="ml-auto text-gray-400 hover:text-white text-2xl leading-none" aria-label="Close checkout">&times;</button>
              </div>
              <div class="flex-1 overflow-y-auto">
                  <div class="max-w-lg mx-auto px-4 py-5 space-y-4">
                      <div class="bg-white border border-gray-200 shadow-sm">
                          <p class="px-4 pt-3 pb-2 text-[10px] font-bold uppercase tracking-widest text-gray-700 border-b border-gray-100"><i class="fas fa-receipt mr-1 text-brand-maroon"></i> Order Preview</p>
                          <div id="checkout-items"></div>
                      </div>
                      <div class="border-l-4 border-brand-maroon bg-white px-4 py-3 shadow-sm">
                          <p class="font-bold text-brand-dark text-[11px] uppercase tracking-widest mb-2">Order &amp; Delivery Terms</p>
                          <ul class="text-xs text-gray-600 space-y-1 leading-relaxed">
                              <li id="checkout-min-order-line" class="hidden">• Minimum order value for delivery: <strong class="text-brand-maroon" id="checkout-min-order"></strong></li>
                              <li>• Delivery charges depend on your area and vehicle — confirmed at time of order</li>
                              <li>• Orders are dispatched after payment confirmation</li>
                              <li>• Delivery time will be confirmed by our WhatsApp representative</li>
                          </ul>
                      </div>
                      <div class="bg-white border border-gray-200 shadow-sm px-4 py-4">
                          <p class="text-[10px] text-gray-700 uppercase tracking-widest mb-3 font-bold">Delivery Details <span class="font-normal normal-case text-brand-maroon">(required)</span></p>
                          <input id="cart-customer-name" type="text" placeholder="Your name *" required
                              class="w-full border border-gray-200 px-3 py-2.5 text-sm mb-2 focus:outline-none focus:border-brand-maroon transition bg-white">
                          <input id="cart-customer-phone" type="tel" placeholder="Contact number *" required
                              class="w-full border border-gray-200 px-3 py-2.5 text-sm mb-2 focus:outline-none focus:border-brand-maroon transition bg-white">
                          <input id="cart-customer-city" type="text" placeholder="City / Area *" required
                              class="w-full border border-gray-200 px-3 py-2.5 text-sm mb-2 focus:outline-none focus:border-brand-maroon transition bg-white">
                          <input id="cart-customer-address" type="text" placeholder="Delivery address *" required
                              class="w-full border border-gray-200 px-3 py-2.5 text-sm focus:outline-none focus:border-brand-maroon transition bg-white">
                      </div>
                  </div>
              </div>
              <div class="flex-shrink-0 bg-white border-t px-4 py-4 shadow-[0_-4px_12px_rgba(0,0,0,0.06)]">
                  <div class="max-w-lg mx-auto space-y-2">
                      <div id="cart-min-order-note" class="hidden text-[10px] text-amber-800 bg-amber-50 border border-amber-200 px-3 py-2 text-center leading-relaxed"></div>
                      <button onclick="checkoutViaWhatsApp()"
                          class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3.5 text-sm uppercase tracking-widest flex items-center justify-center gap-2 transition shadow-md">
                          <i class="fab fa-whatsapp text-lg"></i> Send Order on WhatsApp
                      </button>
                      <p class="text-[10px] text-gray-600 text-center leading-relaxed">
                          <i class="fas fa-truck mr-1"></i>Delivery time depends on your area and will be confirmed by our representative on WhatsApp.
                      </p>
                  </div>
              </div>
          </div>'''

          # ── Generate /s/ product pages and products.json ──
          if not os.path.exists('s'):
              os.makedirs('s')

          for f in os.listdir('s'):
              if f.endswith('.html'):
                  os.remove(os.path.join('s', f))

          products_data = []
          by_category = {}

          for p in rows:
              name  = p['name']
              desc  = p['desc']
              imgs  = p['images']
              slug  = get_clean_slug(name)
              cat_slug = get_clean_slug(p['category'])
              img   = imgs[0] if imgs else f"{BASE_URL}/images/website%20banner.jpg"
              page_url = f"{BASE_URL}/s/{slug}.html"
              cat_link = f"{BASE_URL}/c/{cat_slug}.html"
              name_e = H.escape(name)
              cat_e = H.escape(cat_title(p['category']))
              short_desc = H.escape((desc.split(chr(10))[0] if desc else f"{name} — wholesale veterinary supply from Khyber Traders, Karachi.")[:160])
              pack_sizes = p.get('packSizes') or []
              price_num = parse_price_num(p['priceDisplay'])
              availability = "https://schema.org/InStock" if p['inStock'] else "https://schema.org/OutOfStock"
              is_resource = p.get('isResource', False)

              ld = {
                  "@context": "https://schema.org",
                  "@type": "Product",
                  "name": name,
                  "image": imgs if imgs else [img],
                  "description": (desc or short_desc)[:500],
                  "sku": slug,
                  "category": cat_title(p['category']),
                  "brand": {"@type": "Brand", "name": "Khyber Traders"},
              }
              if pack_sizes:
                  offers = []
                  for ps in pack_sizes:
                      pn = parse_price_num(ps.get('price', ''))
                      if not pn: continue
                      offers.append({
                          "@type": "Offer",
                          "name": ps.get('size', ''),
                          "url": page_url,
                          "priceCurrency": "PKR",
                          "price": pn.replace(',', ''),
                          "availability": availability,
                          "seller": {"@type": "Organization", "name": "Khyber Traders"}
                      })
                  if offers:
                      ld["offers"] = offers
              elif price_num:
                  ld["offers"] = {
                      "@type": "Offer",
                      "url": page_url,
                      "priceCurrency": "PKR",
                      "price": price_num.replace(',', ''),
                      "availability": availability,
                      "seller": {"@type": "Organization", "name": "Khyber Traders"}
                  }
              # Google's Product structured data requires offers, review, or
              # aggregateRating to be present -- a Product block with none of
              # those is invalid and gets flagged in Search Console. Around a
              # fifth of the catalog has no price set yet (out of stock /
              # not yet priced), so for those, skip the Product JSON-LD block
              # entirely rather than ship structured data Google will reject.
              # The breadcrumb JSON-LD below is unaffected and always emitted.
              if "offers" in ld:
                  # Escape any literal "</" in the JSON payload (e.g. a product
                  # name/desc containing "</script") so it can never prematurely
                  # close this tag.
                  ld_json_escaped = json.dumps(ld, ensure_ascii=False).replace('</', '<\\/')
                  ld_json_script = f'<script type="application/ld+json">{ld_json_escaped}</script>'
              else:
                  ld_json_script = ''

              breadcrumb_ld = {
                  "@context": "https://schema.org",
                  "@type": "BreadcrumbList",
                  "itemListElement": [
                      {"@type": "ListItem", "position": 1, "name": "Home", "item": f"{BASE_URL}/"},
                      {"@type": "ListItem", "position": 2, "name": cat_title(p['category']), "item": cat_link},
                      {"@type": "ListItem", "position": 3, "name": name, "item": page_url},
                  ]
              }
              breadcrumb_ld_json = json.dumps(breadcrumb_ld, ensure_ascii=False).replace('</', '<\\/')

              if len(pack_sizes) > 1:
                  price_html = '<div class="packs" id="pack-selector">' + ''.join(
                      f'<button type="button" class="pack-btn{" active" if i == 0 else ""}" data-idx="{i}" onclick="selectOrderPack({i})">{H.escape(ps.get("size",""))} — {H.escape(ps.get("price",""))}</button>'
                      for i, ps in enumerate(pack_sizes)
                  ) + '</div>'
              elif pack_sizes:
                  price_html = '<div class="packs">' + ''.join(
                      f'<span>{H.escape(ps.get("size",""))} — {H.escape(ps.get("price",""))}</span>' for ps in pack_sizes
                  ) + '</div>'
              elif p['priceDisplay']:
                  price_html = f'<div class="price">{H.escape(p["priceDisplay"])}</div>'
              else:
                  price_html = ''
              stock_html = '' if is_resource else ('<span class="stock-in">In Stock</span>' if p['inStock'] else '<span class="stock-out">Out of Stock</span>')
              desc_html = H.escape(desc) if desc else 'Contact us on WhatsApp for full product details.'
              alt_e = f"{name_e} — {cat_e} | Khyber Traders"
              thumbs_html = ''
              if len(imgs) > 1:
                  thumbs_html = '<div class="thumbs">' + ''.join(
                      f'<img src="{im}" alt="{alt_e}" loading="lazy" onclick="document.getElementById(\'main-img\').src=this.src">'
                      for im in imgs
                  ) + '</div>'

              # json.dumps() quotes with ", which would prematurely close this HTML
              # attribute's own " delimiters -- HTML-escape it so the quotes survive
              # as &quot; and the browser hands back a valid JS string/argument.
              name_js_attr = H.escape(json.dumps(name))
              category_js_attr = H.escape(json.dumps(p['category']))
              page_url_js_attr = H.escape(json.dumps(page_url))

              if is_resource:
                  cta_html = (
                      f'<a class="btn btn-primary" href="{img}" download target="_blank"><i class="fas fa-download"></i> Download Chart</a>'
                      f'<button type="button" class="btn btn-outline" onclick="shareProductNative(event,{name_js_attr})"><i class="fas fa-share-alt"></i> Share</button>'
                  )
              elif p['inStock']:
                  # "Order via WhatsApp" used to bypass the cart/checkout flow
                  # entirely with a bare single-item message -- no chance to add
                  # more items, and no minimum-order/delivery-charge info. Checkout
                  # Now now goes through the same cart + checkout screen as adding
                  # multiple items does. Ask a Question stays a separate, instant,
                  # no-form shortcut for a pre-order question.
                  cta_html = (
                      f'<button type="button" class="btn btn-primary" onclick="window.addToCart({name_js_attr}, window.__SELECTED_PACK__)"><i class="fas fa-plus"></i> Add to Order</button>'
                      f'<button type="button" class="btn btn-wa" onclick="window.checkoutProduct({name_js_attr}, window.__SELECTED_PACK__)"><i class="fab fa-whatsapp"></i> Checkout Now</button>'
                      f'<button type="button" class="btn btn-outline" onclick="window.inquireProduct({name_js_attr},{category_js_attr},{page_url_js_attr})"><i class="fas fa-circle-question"></i> Ask a Question</button>'
                      f'<button type="button" class="btn btn-outline" onclick="shareProductNative(event,{name_js_attr})"><i class="fas fa-share-alt"></i> Share</button>'
                  )
              else:
                  cta_html = (
                      '<button type="button" class="btn" style="background:#e5e7eb;color:#9ca3af;cursor:not-allowed" disabled>Out of Stock</button>'
                      f'<button type="button" class="btn btn-outline" onclick="window.inquireProduct({name_js_attr},{category_js_attr},{page_url_js_attr})"><i class="fas fa-circle-question"></i> Ask a Question</button>'
                      f'<button type="button" class="btn btn-outline" onclick="shareProductNative(event,{name_js_attr})"><i class="fas fa-share-alt"></i> Share</button>'
                  )

              # window.__PRODUCT__ lets the shared cart.js (also used by index.html)
              # add this single product to the order list, share it, or build an
              # inquiry message without fetching the whole catalog. Escape literal
              # "</" the same way as the JSON-LD above.
              product_json = json.dumps({
                  "name":         name,
                  "category":     p['category'],
                  "desc":         desc,
                  "packSizes":    pack_sizes,
                  "priceDisplay": p['priceDisplay'],
                  "images":       imgs,
                  "inStock":      p['inStock'],
                  "minQty":       p['minQty'],
                  "isResource":   is_resource,
              }, ensure_ascii=False).replace('</', '<\\/')
              # Loaded after cart.js (below) so fetchSettings(), defined there, exists
              # by the time this script calls it.
              page_script = f"""<script>
              window.__PRODUCT__ = {product_json};
              window.__SELECTED_PACK__ = (window.__PRODUCT__.packSizes && window.__PRODUCT__.packSizes.length) ? window.__PRODUCT__.packSizes[0] : null;
              function selectOrderPack(idx) {{
                  window.__SELECTED_PACK__ = window.__PRODUCT__.packSizes[idx];
                  document.querySelectorAll('.pack-btn').forEach(function(btn, i) {{
                      btn.classList.toggle('active', i === idx);
                  }});
              }}
              fetchSettings();
              </script>"""

              file_content = f"""<!DOCTYPE html>
              <html lang="en">
              <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>{name_e} | Khyber Traders — Wholesale Veterinary Pharmacy Karachi</title>
              <meta name="description" content="{short_desc}">
              <link rel="canonical" href="{page_url}">
              <meta property="og:title" content="{name_e}">
              <meta property="og:description" content="{short_desc}">
              <meta property="og:image" content="{img}">
              <meta property="og:url" content="{page_url}">
              <meta property="og:type" content="product">
              <meta name="twitter:card" content="summary_large_image">
              <meta name="twitter:title" content="{name_e}">
              <meta name="twitter:description" content="{short_desc}">
              <meta name="twitter:image" content="{img}">
              <link rel="icon" href="{BASE_URL}/images/KT_Logo_Icon.png">
              {ld_json_script}
              <script type="application/ld+json">{breadcrumb_ld_json}</script>
              {page_head_common()}
              {product_page_extra_head()}
              </head>
              <body>
              {header_html_with_cart()}
              <div class="wrap">
              <div class="crumb"><a href="{BASE_URL}/">Home</a> &rsaquo; <a href="{cat_link}">{cat_e}</a> &rsaquo; {name_e}</div>
              <img class="product-img" id="main-img" src="{img}" alt="{alt_e}" loading="lazy">
              {thumbs_html}
              <h1>{name_e}</h1>
              {price_html}
              {stock_html}
              <p class="desc">{desc_html}</p>
              <div class="cta">
              {cta_html}
              </div>
              </div>
              {footer_html()}
              {cart_widget_html()}
              <canvas id="share-canvas"></canvas>
              <script src="{BASE_URL}/assets/cart.js"></script>
              {page_script}
              </body>
              </html>"""

              with open(f"s/{slug}.html", "w", encoding="utf-8") as fh:
                  fh.write(file_content)

              entry = {
                  "category":     p['category'],
                  "name":         name,
                  "slug":         slug,
                  "inStock":      p['inStock'],
                  "priceDisplay": p['priceDisplay'],
                  "images":       imgs,
                  "packSizes":    pack_sizes,
              }
              # products.json keeps its original schema -- only images/packSizes are
              # used locally to build the /s/ and /c/ page HTML, not written out.
              products_data.append({k: v for k, v in entry.items() if k not in ("images", "packSizes")})
              by_category.setdefault(p['category'], []).append(entry)

          with open("products.json", "w", encoding="utf-8") as jf:
              json.dump(products_data, jf, ensure_ascii=False, indent=2)

          print(f"Generated {len(products_data)} product pages and products.json.")

          # ── Generate category share cards (/c/{slug}.html + images/og/{slug}.png) ──
          # Icon rules must mirror CAT_ICONS in index.html — keep both in sync when adding keywords.
          from PIL import Image, ImageDraw, ImageFont

          FONT_DIR = "assets/fonts"
          ICON_CODEPOINTS = {
              "pump-soap": "e06b", "cow": "f6c8", "bottle-droplet": "e4c4", "tags": "f02c",
              "wheat-awn": "e2cd", "prescription-bottle-medical": "f486", "dna": "f471",
              "filter": "f0b0", "calendar-days": "f073", "shield-virus": "e06c", "syringe": "f48e",
              "flask": "f0c3", "clipboard-list": "f46d", "box-open": "f49e", "glass-water": "e4f4",
              "screwdriver-wrench": "f7d9", "toolbox": "f552", "globe": "f0ac",
          }
          # Exact-match icon overrides, kept in sync with CATEGORY_ICON_OVERRIDES in
          # index.html's homepage tile grid so a category's OG share thumbnail always
          # shows the same icon as its tile. Checked before the keyword fallback below.
          ICON_OVERRIDES = {
              'anti-lice shampoo for cattle': 'pump-soap',
              'butter milk for fattening cattle': 'glass-water',
              'dewromer drenches': 'bottle-droplet',
              'drench guns and drencher syringes': 'screwdriver-wrench',
              'ear tags for cattle & goats': 'tags',
              'feed premix & minerals mixture': 'wheat-awn',
              'gripe water': 'prescription-bottle-medical',
              'ivomec & other skin inj.': 'syringe',
              'liver tonic / growth promoter / digestive support': 'flask',
              'protocol of artificial insemination (ai)': 'dna',
              'steel needles and reusable injectors for vet use': 'toolbox',
              'toxin binders': 'filter',
              'vaccine chart and dosage schedule': 'calendar-days',
              'vaccines': 'shield-virus',
          }
          # Keyword fallback for any category not in the exact-match table above.
          ICON_RULES = [
              ("shampoo", "pump-soap"), ("lice", "pump-soap"),
              ("milk", "glass-water"), ("fatten", "cow"),
              ("drench", "bottle-droplet"), ("dewormer", "bottle-droplet"), ("dewromer", "bottle-droplet"),
              ("tag", "tags"),
              ("feed", "wheat-awn"), ("premix", "wheat-awn"), ("mineral", "wheat-awn"),
              ("gripe", "prescription-bottle-medical"),
              ("insemination", "dna"),
              ("toxin", "filter"),
              ("chart", "calendar-days"), ("schedule", "calendar-days"),
              ("vaccine", "shield-virus"),
              ("inj", "syringe"), ("ivomec", "syringe"),
              ("liver", "flask"), ("tonic", "flask"), ("digestive", "flask"),
              ("protocol", "clipboard-list"),
          ]

          def icon_for(cat):
              c = (cat or '').strip().lower()
              if c in ICON_OVERRIDES: return ICON_OVERRIDES[c]
              for kw, ic in ICON_RULES:
                  if kw in c: return ic
              return "box-open"

          # GOLD is the dominant field (matches the homepage tile cards), DARK is the
          # icon circle / heading / border, MUTED is the de-emphasized subtitle line.
          GOLD, DARK, MUTED = (255,242,0), (0,0,0), (60,60,60)
          CARD_W, CARD_H = 1200, 630
          STRIP_H = 116
          BORDER = 22

          def load_font(name, size, weight=None):
              f = ImageFont.truetype(f"{FONT_DIR}/{name}", size)
              if weight:
                  try: f.set_variation_by_axes([weight])
                  except Exception: pass
              return f

          def center_text(draw, y, text, font, fill, tracking=0):
              if tracking:
                  widths = [draw.textlength(ch, font=font) + tracking for ch in text]
                  total = sum(widths) - tracking
                  x = (CARD_W - total) / 2
                  for ch, w in zip(text, widths):
                      draw.text((x, y), ch, font=font, fill=fill); x += w
              else:
                  tw = draw.textlength(text, font=font)
                  draw.text(((CARD_W - tw) / 2, y), text, font=font, fill=fill)

          def wrap_text(draw, text, font, max_w):
              words, lines, cur = text.split(), [], ""
              for w in words:
                  t = (cur + " " + w).strip()
                  if draw.textlength(t, font=font) <= max_w: cur = t
                  else: lines.append(cur); cur = w
              if cur: lines.append(cur)
              return lines

          def make_category_og_image(cat, slug):
              img = Image.new("RGB", (CARD_W, CARD_H), GOLD)
              dr = ImageDraw.Draw(img)
              dr.rectangle([0, CARD_H - STRIP_H, CARD_W, CARD_H], fill=DARK)
              dr.rectangle([BORDER, BORDER, CARD_W - BORDER - 1, CARD_H - BORDER - 1], outline=DARK, width=3)

              name = cat_title(cat)
              # Pick the biggest heading size (of a few steps) that still wraps to at
              # most 2 lines, so short names get to use the extra space instead of
              # leaving it empty, and long names scale down instead of overflowing.
              for size in (76, 68, 60, 52):
                  tf = load_font("PlayfairDisplay.ttf", size, 700)
                  lines = wrap_text(dr, name, tf, 1040)
                  if len(lines) <= 2:
                      break

              icon_d = 148
              gap_icon_heading = 46
              line_gap = 14
              heading_h = len(lines) * tf.size + (len(lines) - 1) * line_gap
              gap_heading_divider = 40  # clears descenders (g/y/p) instead of touching them
              divider_h = 5
              gap_divider_subtitle = 26
              sub_font = load_font("Manrope.ttf", 26, 500)

              # Center the whole icon+heading+divider+subtitle block within the space
              # above the bottom strip, rather than pinning it to fixed y-positions.
              block_h = icon_d + gap_icon_heading + heading_h + gap_heading_divider + divider_h + gap_divider_subtitle + sub_font.size
              avail_h = (CARD_H - STRIP_H) - BORDER
              top = BORDER + (avail_h - block_h) / 2

              cy = top + icon_d / 2
              dr.ellipse([CARD_W/2 - icon_d/2, cy - icon_d/2, CARD_W/2 + icon_d/2, cy + icon_d/2], fill=DARK)
              glyph = chr(int(ICON_CODEPOINTS[icon_for(cat)], 16))
              gf = ImageFont.truetype(f"{FONT_DIR}/FontAwesomeSolid.ttf", int(icon_d * 0.44))
              bb = dr.textbbox((0, 0), glyph, font=gf)
              dr.text((CARD_W/2 - (bb[0]+bb[2])/2, cy - (bb[1]+bb[3])/2), glyph, font=gf, fill=GOLD)

              y = top + icon_d + gap_icon_heading
              for ln in lines:
                  center_text(dr, y, ln, tf, DARK)
                  y += tf.size + line_gap
              y = y - line_gap + gap_heading_divider
              dr.rectangle([CARD_W/2 - 55, y, CARD_W/2 + 55, y + divider_h], fill=DARK)
              y += divider_h + gap_divider_subtitle
              center_text(dr, y, "KHYBER TRADERS  ·  WHOLESALE VETERINARY PHARMACY", sub_font, MUTED, tracking=2)

              # URL row: small globe icon + bigger, bolder domain name, both centered
              # together as one unit in the bottom strip.
              url_font = load_font("Manrope.ttf", 50, 800)
              url_text = "animalhealth.pk"
              url_tb = dr.textbbox((0, 0), url_text, font=url_font)
              url_w, url_h = url_tb[2] - url_tb[0], url_tb[3] - url_tb[1]

              globe_font = ImageFont.truetype(f"{FONT_DIR}/FontAwesomeSolid.ttf", 38)
              globe_glyph = chr(int(ICON_CODEPOINTS["globe"], 16))
              globe_tb = dr.textbbox((0, 0), globe_glyph, font=globe_font)
              globe_w, globe_h = globe_tb[2] - globe_tb[0], globe_tb[3] - globe_tb[1]

              icon_text_gap = 18
              row_x = (CARD_W - (globe_w + icon_text_gap + url_w)) / 2
              strip_cy = CARD_H - STRIP_H / 2
              dr.text((row_x - globe_tb[0], strip_cy - globe_h/2 - globe_tb[1]), globe_glyph, font=globe_font, fill=GOLD)
              dr.text((row_x + globe_w + icon_text_gap - url_tb[0], strip_cy - url_h/2 - url_tb[1]), url_text, font=url_font, fill=GOLD)

              os.makedirs("images/og", exist_ok=True)
              img.save(f"images/og/{slug}.png", optimize=True)

          # User-approved, hand-written intro paragraphs (not auto-generated from
          # product data) giving each category page real, unique body content —
          # Search Console flagged these pages as thin/near-duplicate. Keyed by the
          # exact category string as stored in Firestore; a category not in this
          # dict simply renders without an intro (no error).
          CATEGORY_INTROS = {
              "anti-lice shampoo for cattle": "Specialized shampoos formulated for cattle to control lice and small external parasites while keeping the coat and skin clean and healthy. Available in small packs and bulk 5-litre cans for wholesale buyers.",
              "butter milk for fattening cattle": "Milk replacer powder (CMR) used as an easy-to-use, hygienic substitute or supplement to natural milk when raising and fattening calves, formulated for consistent milk/butter fat and high protein content.",
              "dewromer drenches": "Oral deworming drenches for cattle and goats, formulated with anthelmintic actives such as albendazole, oxfendazole, and levamisole to control internal parasites such as roundworms, lungworms, and liver fluke, as part of a regular herd deworming programme.",
              "drench guns and drencher syringes": "Application equipment for administering oral drenches accurately and efficiently, available in sizes suited to both goats and cattle.",
              "ear tags for cattle & goats": "Identification tags for cattle and goats, used for herd record-keeping, traceability, and management. Supplied in bulk with optional laser engraving.",
              "feed premix & minerals mixture": "Vitamin and mineral premix powders added to cattle feed to support general nutrition, growth, and condition, including combinations of vitamins, minerals, DCP, yeast, and toxin binders.",
              "gripe water": "A supportive product for digestive discomfort in young calves, goats, and fattening cattle, mixed with water and dosed according to animal size.",
              "ivomec & other skin inj.": "Injectable ivermectin-based products used for the control of internal and external parasites in cattle, buffalo, sheep, and goats, sourced from established manufacturers.",
              "liver tonic / growth promoter / digestive support": "Tonics formulated to support liver function, digestion, and overall growth in cattle as part of routine herd health management.",
              "protocol of artificial insemination (ai)": "A reference guide to artificial insemination protocols for cattle breeding programmes, including Ov-Synch scheduling, for farm and veterinary use.",
              "steel needles and reusable injectors for vet use": "Durable steel needles and reusable injectors for veterinary use on farms, available in multiple gauges and volumes for routine injections.",
              "toxin binders": "Feed additives formulated to bind mycotoxins that can occur in contaminated feed, intended to support animal health and feed safety as part of a herd nutrition programme.",
              "vaccine chart and dosage schedule": "A reference chart summarizing common cattle vaccination timing and dosage schedules, intended as a general guide for farm and veterinary planning.",
              "vaccines": "Vaccines for common cattle and small-ruminant diseases including FMD (Foot & Mouth Disease), LSD (Lumpy Skin Disease), PPR, HS/Pasteurella, and clostridial diseases, sourced from manufacturers in Russia, Turkey, and Spain.",
          }

          def make_category_page(cat, slug, products):
              cat_e = H.escape(cat_title(cat))
              page_url = f"{BASE_URL}/c/{slug}.html"
              interactive_link = f"{BASE_URL}/?cat={slug}"
              og_image = f"{BASE_URL}/images/og/{slug}.png"
              short_desc = H.escape(f"Browse {cat_title(cat)} — {len(products)} wholesale veterinary product{'s' if len(products) != 1 else ''} from Khyber Traders, Karachi.")

              ld = {
                  "@context": "https://schema.org",
                  "@type": "CollectionPage",
                  "name": cat_title(cat),
                  "url": page_url,
                  "hasPart": [
                      # WebPage, not Product: this is a lightweight link reference to
                      # the product's own page, which already carries full Product
                      # schema (offers/price/availability). Typing these as Product
                      # without those fields tripped Google's Product rich-result
                      # validator ("Either 'offers', 'review', or 'aggregateRating'
                      # should be specified") on every single item, on every category
                      # page.
                      {"@type": "WebPage", "name": p['name'], "url": f"{BASE_URL}/s/{p['slug']}.html"}
                      for p in products
                  ]
              }
              # Escape any literal "</" in the JSON payload (e.g. a product name/desc
              # containing "</script") so it can never prematurely close this tag.
              ld_json = json.dumps(ld, ensure_ascii=False).replace('</', '<\\/')

              breadcrumb_ld = {
                  "@context": "https://schema.org",
                  "@type": "BreadcrumbList",
                  "itemListElement": [
                      {"@type": "ListItem", "position": 1, "name": "Home", "item": f"{BASE_URL}/"},
                      {"@type": "ListItem", "position": 2, "name": cat_title(cat), "item": page_url},
                  ]
              }
              breadcrumb_ld_json = json.dumps(breadcrumb_ld, ensure_ascii=False).replace('</', '<\\/')

              cards = []
              for p in products:
                  pimg = p['images'][0] if p['images'] else f"{BASE_URL}/images/website%20banner.jpg"
                  p_packs = p.get('packSizes') or []
                  if p_packs:
                      lowest = p_packs[0]
                      price_tag = f'<div class="cprice">{H.escape(lowest.get("size",""))} {H.escape(lowest.get("price",""))}{" +" if len(p_packs) > 1 else ""}</div>'
                  elif p['priceDisplay']:
                      price_tag = f'<div class="cprice">{H.escape(p["priceDisplay"])}</div>'
                  else:
                      price_tag = ''
                  card_alt = f'{H.escape(p["name"])} — {cat_e} | Khyber Traders'
                  cards.append(f'''<a class="card" href="{BASE_URL}/s/{p['slug']}.html">
              <img src="{pimg}" alt="{card_alt}" loading="lazy">
              <h3>{H.escape(p['name'])}</h3>
              {price_tag}
              </a>''')

              html_out = f"""<!DOCTYPE html>
              <html lang="en">
              <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>{cat_e} | Khyber Traders — Wholesale Veterinary Pharmacy Karachi</title>
              <meta name="description" content="{short_desc}">
              <link rel="canonical" href="{page_url}">
              <meta property="og:title" content="{cat_e} — Khyber Traders">
              <meta property="og:description" content="{short_desc}">
              <meta property="og:image" content="{og_image}">
              <meta property="og:image:width" content="1200">
              <meta property="og:image:height" content="630">
              <meta property="og:url" content="{page_url}">
              <meta property="og:type" content="website">
              <meta name="twitter:card" content="summary_large_image">
              <meta name="twitter:title" content="{cat_e} — Khyber Traders">
              <meta name="twitter:description" content="{short_desc}">
              <meta name="twitter:image" content="{og_image}">
              <link rel="icon" href="{BASE_URL}/images/KT_Logo_Icon.png">
              <script type="application/ld+json">{ld_json}</script>
              <script type="application/ld+json">{breadcrumb_ld_json}</script>
              {page_head_common()}
              </head>
              <body>
              {header_html()}
              <div class="wrap">
              <div class="crumb"><a href="{BASE_URL}/">Home</a> &rsaquo; {cat_e}</div>
              <h1>{cat_e}</h1>
              {f'<p class="desc">{H.escape(CATEGORY_INTROS[cat.strip().lower()])}</p>' if cat.strip().lower() in CATEGORY_INTROS else ''}
              <p class="desc" style="margin-bottom:6px">{len(products)} product{'s' if len(products) != 1 else ''} available for wholesale order.</p>
              <div class="cta"><a class="btn btn-primary" href="{interactive_link}">View Interactive Catalog</a></div>
              <div class="grid">
              {''.join(cards)}
              </div>
              </div>
              {footer_html()}
              </body>
              </html>"""
              os.makedirs("c", exist_ok=True)
              with open(f"c/{slug}.html", "w", encoding="utf-8") as fh:
                  fh.write(html_out)

          live_categories = sorted({p["category"] for p in rows if p["category"]})
          live_slugs = set()
          for cat in live_categories:
              slug = get_clean_slug(cat)
              live_slugs.add(slug)
              make_category_og_image(cat, slug)
              make_category_page(cat, slug, by_category.get(cat, []))

          # Remove cards for categories that no longer exist (renamed/deleted)
          for folder, ext in (("c", ".html"), ("images/og", ".png")):
              if not os.path.exists(folder): continue
              for fn in os.listdir(folder):
                  if fn.endswith(ext) and fn[:-len(ext)] not in live_slugs:
                      os.remove(os.path.join(folder, fn))

          print(f"Generated {len(live_slugs)} category pages.")

          # ── Generate sitemap.xml and sitemap.html ──
          sm_urls = [f"{BASE_URL}/"]
          sm_urls += [f"{BASE_URL}/c/{get_clean_slug(c)}.html" for c in live_categories]
          sm_urls += [f"{BASE_URL}/s/{get_clean_slug(p['name'])}.html" for p in rows]
          sm_items = ''.join(f'<url><loc>{u}</loc><lastmod>{TODAY}</lastmod></url>\n' for u in sm_urls)
          with open("sitemap.xml", "w", encoding="utf-8") as fh:
              fh.write(f'<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n{sm_items}</urlset>\n')

          sm_sections = []
          for cat in live_categories:
              cat_e = H.escape(cat_title(cat))
              cslug = get_clean_slug(cat)
              items = ''.join(f'<li><a href="{BASE_URL}/s/{p["slug"]}.html">{H.escape(p["name"])}</a></li>' for p in by_category.get(cat, []))
              sm_sections.append(f'<h2 class="smcat"><a href="{BASE_URL}/c/{cslug}.html">{cat_e}</a></h2><ul class="smlist">{items}</ul>')
          sm_body = ''.join(sm_sections)
          sitemap_html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Full Product Catalog | Khyber Traders</title>
          <meta name="description" content="Complete list of wholesale veterinary products from Khyber Traders, Karachi — organized by category.">
          <link rel="canonical" href="{BASE_URL}/sitemap.html">
          <link rel="icon" href="{BASE_URL}/images/KT_Logo_Icon.png">
          {page_head_common()}
          </head>
          <body>
          {header_html()}
          <div class="wrap">
          <div class="crumb"><a href="{BASE_URL}/">Home</a> &rsaquo; Full Catalog</div>
          <h1>Full Product Catalog</h1>
          {sm_body}
          </div>
          {footer_html()}
          </body>
          </html>"""
          with open("sitemap.html", "w", encoding="utf-8") as fh:
              fh.write(sitemap_html)

          print(f"Generated sitemap.xml ({len(sm_urls)} urls) and sitemap.html.")

      - name: Commit and Push Changes
        id: commit
        run: |
          git config --global user.name "Product-Bot"
          git config --global user.email "bot@animalhealth.pk"
          git add s/ c/ images/og/ products.json sitemap.xml sitemap.html
          if git diff --staged --quiet; then
            echo "No changes to sync."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-sync products: $(date)"
            git pull --rebase origin claude/website-improvements-tlKIS
            git push origin HEAD:claude/website-improvements-tlKIS
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Mirror the generated artifacts onto main as well, so main does not ──
      # ── fall behind on product content between manual source merges.      ──
      # ── Only the bot-generated paths are copied; source files on main are ──
      # ── never touched, so this can never carry unreviewed source changes  ──
      # ── across. Runs unconditionally (not gated on `changed`) so that if  ──
      # ── main ever drifts out of sync it self-heals on the next run.       ──
      - name: Mirror generated files to main
        run: |
          set -euo pipefail
          SRC="$(git rev-parse HEAD)"
          git fetch origin main
          git checkout -B __sync_main origin/main

          # Clear first so products deleted upstream also disappear from main,
          # rather than lingering as orphaned pages.
          rm -rf s c images/og
          git checkout "$SRC" -- s c images/og products.json sitemap.xml sitemap.html
          git add -A s c images/og products.json sitemap.xml sitemap.html

          if git diff --staged --quiet; then
            echo "main already has the current generated content; nothing to mirror."
          else
            git commit -m "Auto-sync products (mirror to main): $(date)"
            git push origin __sync_main:main
            echo "Mirrored generated content to main."
          fi

      - name: Trigger Deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref claude/website-improvements-tlKIS
