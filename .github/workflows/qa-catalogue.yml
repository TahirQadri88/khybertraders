name: Catalogue Render QA

on:
  push:
    branches: [claude/website-improvements-tlKIS]
    paths: ['assets/cart.js', 'index.html', '.github/workflows/qa-catalogue.yml']
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: claude/website-improvements-tlKIS
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Validate JavaScript
        run: node --check assets/cart.js
      - name: Run rendered desktop/mobile QA
        run: |
          cat > /tmp/qa.js <<'NODE'
          const { chromium } = require('playwright');
          const { spawn } = require('child_process');
          const server = spawn('python3', ['-m', 'http.server', '4173', '--bind', '127.0.0.1'], {cwd: process.cwd(), stdio:'ignore'});
          (async()=>{
            const browser = await chromium.launch({headless:true});
            try {
              const checks=[];
              for (const vp of [{name:'desktop',width:1440,height:1000},{name:'mobile',width:390,height:844}]) {
                const page=await browser.newPage({viewport:{width:vp.width,height:vp.height}, deviceScaleFactor:1});
                const consoleErrors=[];
                page.on('console',m=>{ if(m.type()==='error') consoleErrors.push(m.text()); });
                page.on('pageerror',e=>consoleErrors.push('PAGEERROR: '+e.message));
                await page.goto('http://127.0.0.1:4173/index.html', {waitUntil:'domcontentloaded'});
                await page.waitForFunction(()=>Array.isArray(window.allProducts) && window.allProducts.length>0,{timeout:30000});
                await page.waitForSelector('#kt-home-catalogue .kt-card',{timeout:30000});
                const result=await page.evaluate(()=>{
                  const legacyModal=document.querySelector('#category-modal');
                  const legacyResults=document.querySelector('#search-results');
                  const bars=document.querySelectorAll('#kt-order-bar');
                  const mobileBar=document.querySelector('#mobile-cart-bar');
                  const strip=document.querySelector('#kt-category-strip');
                  const grid=document.querySelector('#kt-home-catalogue .kt-grid');
                  return {
                    cards:document.querySelectorAll('#kt-home-catalogue .kt-card').length,
                    searchCount:document.querySelectorAll('#product-search').length,
                    legacyModalVisible:!!legacyModal && getComputedStyle(legacyModal).display!=='none',
                    legacyResultsVisible:!!legacyResults && getComputedStyle(legacyResults).display!=='none',
                    bars:bars.length,
                    mobileBarVisible:!!mobileBar && getComputedStyle(mobileBar).display!=='none',
                    nav:!!document.querySelector('#kt-category-nav'),
                    arrows:!!document.querySelector('#kt-cat-prev')&&!!document.querySelector('#kt-cat-next'),
                    overflow:!!strip&&strip.scrollWidth>strip.clientWidth,
                    gridCols:grid?getComputedStyle(grid).gridTemplateColumns.split(' ').length:0,
                    heading:document.querySelector('#products h2')?.textContent.trim()
                  };
                });
                if(result.cards<20) throw new Error(`${vp.name}: only ${result.cards} catalogue cards`);
                if(result.searchCount!==1) throw new Error(`${vp.name}: expected one search input, got ${result.searchCount}`);
                if(result.legacyModalVisible) throw new Error(`${vp.name}: legacy category modal visible`);
                if(result.legacyResultsVisible) throw new Error(`${vp.name}: legacy search results visible`);
                if(result.bars!==1) throw new Error(`${vp.name}: expected one persistent order bar, got ${result.bars}`);
                if(result.mobileBarVisible) throw new Error(`${vp.name}: legacy mobile cart bar still visible`);
                if(!result.nav||!result.arrows) throw new Error(`${vp.name}: category navigation/arrows missing`);
                const expectedCols=vp.name==='mobile'?2:4;
                if(result.gridCols!==expectedCols) throw new Error(`${vp.name}: expected ${expectedCols} grid columns, got ${result.gridCols}`);
                const categories=page.locator('#kt-category-strip button[data-category]');
                const count=await categories.count();
                if(count<2) throw new Error(`${vp.name}: insufficient category filters`);
                const firstCategory=await categories.nth(1).getAttribute('data-category');
                const initialCount=result.cards;
                await categories.nth(1).click();
                await page.waitForTimeout(150);
                const filtered=await page.locator('#kt-home-catalogue .kt-card').count();
                if(filtered<1 || filtered>=initialCount) throw new Error(`${vp.name}: category filter did not narrow catalogue`);
                await page.locator('#product-search').fill('milk');
                await page.waitForTimeout(250);
                const searched=await page.locator('#kt-home-catalogue .kt-card').count();
                if(searched<1 || searched>=initialCount) throw new Error(`${vp.name}: search did not narrow catalogue`);
                await page.locator('#product-search').fill('');
                await page.waitForTimeout(150);
                const card=page.locator('#kt-home-catalogue .kt-card').first();
                const packButtons=card.locator('.kt-pack-btn');
                if(await packButtons.count()>1) await packButtons.first().click();
                const before=await page.locator('#kt-order-bar').textContent();
                await card.locator('.kt-add').click();
                await page.waitForTimeout(200);
                const after=await page.locator('#kt-order-bar').textContent();
                if(before===after) throw new Error(`${vp.name}: Add to Order did not update persistent order bar`);
                if(await page.locator('#cart-drawer').isVisible().catch(()=>false)) throw new Error(`${vp.name}: Add to Order opened cart drawer`);
                await page.reload({waitUntil:'domcontentloaded'});
                await page.waitForFunction(()=>Array.isArray(window.allProducts)&&window.allProducts.length>0,{timeout:30000});
                await page.waitForSelector('#kt-home-catalogue .kt-card',{timeout:30000});
                const persisted=await page.locator('#kt-order-bar').textContent();
                if(!/\b[1-9]\d*\s+products?\b/i.test(persisted)) throw new Error(`${vp.name}: cart did not persist after reload`);
                checks.push({viewport:vp.name,result,category:firstCategory,filtered,searched,consoleErrors});
                await page.close();
              }
              const bad=checks.flatMap(x=>x.consoleErrors).filter(e=>!/(ERR_BLOCKED_BY_CLIENT|404|animalhealth\.pk|cloudinary|fonts|fontawesome|tailwind|google-analytics)/i.test(e));
              if(bad.length) throw new Error('Unexpected console errors: '+bad.join('\n'));
              console.log(JSON.stringify({status:'PASS',checks},null,2));
            } finally { await browser.close(); server.kill('SIGTERM'); }
          })().catch(e=>{ console.error(e.stack||e); process.exit(1); });
          NODE
          node /tmp/qa.js
      - name: Remove temporary QA workflow
        if: success()
        run: |
          rm -f .github/workflows/qa-catalogue.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary catalogue QA workflow" || true
          git push origin HEAD:claude/website-improvements-tlKIS
